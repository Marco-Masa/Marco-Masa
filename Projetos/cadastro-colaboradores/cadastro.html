<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Colaboradores - Lojas Brincos e Cia.</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <div class="container1">
            <img src="./logo.png" alt="Logotipo Lojas Brincos e Companhia">
        </div>
        <div class="container2">
            <form action="processaCadastro.php" method="POST">
                <fieldset>
                    <legend>Cadastro de Colaboradores</legend>
                    <h5 class="atencao">* Campos obrigatórios</h5>
                
                    <label for="nome"><span class="atencao">* </span>Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Informe seu nome completo." title="Informe o seu nome completo. Este campo é obrigatório" required>
                
                    <label for="idade"><span class="atencao">* </span>Idade: (anos)</label>
                    <input type="number" id="idade" name="idade" max="120" placeholder="0" title="Informe a sua idade, somente números. Este campo é obrigatório" required>
                
                    <label for="profissao"><span class="atencao">* </span>Profissão:</label>
                    <input type="text" id="profissao" name="profissao" placeholder="Informe sua profissão" title="Informe a sua profissão. Este campo é obrigatório" required>
                
                    <label for="salario"><span class="atencao">* </span>Salário Pretendido:</label>
                    <input type="number" id="salario" name="salario" min="0" step="0.01" pattern="^\d+([.,]\d{2})?$" title="Informe o Salário que tem pretensão. Este campo é obrigatório" placeholder="0,00" required>
                
                    <label for="experiencia"><span class="atencao">* </span>Experiências Anteriores:</label>
                    <textarea type="password" id="experiencia" name="experiencia" rows="5" placeholder="Informe suas experiências anteriores" title="Descreva as suas Experiências Anteriores. Este campo é obrigatório" required></textarea>
                
                    <div>
                        <input class="botao" type="submit" value="Cadastrar" title="Clique para enviar as informações para cadastro.">
                    </div>
                </fieldset>
            </form>
        </div>
        
    </main>
</body>

</html>
